name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Laptop-side tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The installer and the site bundle carry the current relay and site
        run: node scripts/vps-bundle.js --check
      - run: npm test

  app:
    name: Nod APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Add the Firebase config (push notifications), if the secret exists
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "No GOOGLE_SERVICES_JSON secret: building without push (Settings will say Not set up)."
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
          # Fail early, without printing the file, if it is the wrong thing.
          node -e '
            const fs = require("fs");
            let data;
            try { data = JSON.parse(fs.readFileSync("google-services.json", "utf8")); }
            catch { console.error("::error::GOOGLE_SERVICES_JSON is not valid JSON"); process.exit(1); }
            const names = (data.client || []).map((c) => c.client_info && c.client_info.android_client_info && c.client_info.android_client_info.package_name);
            if (!names.includes("com.ajkadri.nod")) { console.error("::error::GOOGLE_SERVICES_JSON has no Android app with package name com.ajkadri.nod"); process.exit(1); }
          ' || { rm -f google-services.json; exit 1; }
          echo "google-services.json written; the build will include push."
      - name: Release signing key (if the secrets exist)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "::warning::No release signing secrets: this APK is signed with the debug key and will not match the key published for nod.ajkadri.dev."
            exit 0
          fi
          KEYSTORE="$RUNNER_TEMP/nod-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          # Fail early if the key or the passwords are wrong, without printing them.
          keytool -list -keystore "$KEYSTORE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" > /dev/null \
            || { echo "::error::The signing secrets do not open the keystore (wrong password or alias)"; rm -f "$KEYSTORE"; exit 1; }
          echo "NOD_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "NOD_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NOD_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "Release signing key loaded."
      - name: Generate the Android project
        env:
          NOD_VERSION_CODE: ${{ github.run_number }}
        run: npx expo prebuild --platform android --no-install
      - name: Build release APK (32-bit and 64-bit)
        working-directory: mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a --no-daemon
      - name: Verify signature
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | tee signer.txt
          # With the release key loaded, the published fingerprint must be this one.
          echo "Signing certificate SHA-256 (compare with site/.well-known/assetlinks.json):"
          grep "SHA-256 digest" signer.txt || true
          ls -la android/app/build/outputs/apk/release/
      - uses: actions/upload-artifact@v4
        with:
          name: nod-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  wallet:
    name: Mock MWA Wallet APK (testing only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: solana-mobile/mock-mwa-wallet
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - run: ./gradlew assembleDebug --no-daemon
      - run: find app/build/outputs/apk -name "*.apk" -exec ls -la {} \;
      - uses: actions/upload-artifact@v4
        with:
          name: mock-wallet-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  publish:
    name: Publish APKs to the build-artifacts branch
    needs: [app, wallet]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloaded
      - name: Push APKs to an orphan branch (replaced on every build)
        run: |
          mkdir out
          cp downloaded/nod-apk/app-release.apk out/nod.apk
          cp "$(ls downloaded/mock-wallet-apk/*.apk | head -1)" out/mock-wallet.apk
          cd out
          sha256sum *.apk > SHA256SUMS
          echo "Built from ${GITHUB_SHA} by run ${GITHUB_RUN_ID}" > BUILD.txt
          ls -la
          git init -q -b build-artifacts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "APKs for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" build-artifacts
